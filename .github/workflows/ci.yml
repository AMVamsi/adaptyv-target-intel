# Tests, evals and extraction scoring on every push.
#
# The eval and score steps are the point: they gate on measured behaviour,
# not just on "did the tests pass". `target-intel eval` exits non-zero if a
# deterministic guard trips - a well-studied target producing no quantitative
# sources, a sparse target outscoring a rich one, calibration error drifting
# past its threshold. Those hold independently of the calibration numbers,
# so they catch extraction actually breaking rather than moving with it.
#
# The matrix pins both MCP SDK generations. `mcp>=1.0` resolves to 2.x today,
# but 1.x is still widely pinned in existing environments, and the server is
# written against the surface both share. Testing one generation would let
# the other break silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        mcp-version: ["mcp>=2.0", "mcp<2.0"]

    name: py${{ matrix.python-version }} · ${{ matrix.mcp-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "${{ matrix.mcp-version }}"

      - name: Lint
        run: ruff check src tests scripts evals

      - name: Tests
        run: pytest

      # No network in CI, and none needed: the literature snapshot ships in
      # the repo. A test that reaches PubMed would be flaky by construction.
      - name: Extraction scoring vs. gold set
        run: target-intel score

      - name: Calibration report and regression guards
        run: target-intel eval
